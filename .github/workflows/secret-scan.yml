name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks current tree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Scan current tree for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.24.2
        with:
          args: detect --no-git --redact --source /github/workspace --config /github/workspace/.gitleaks.toml --verbose
